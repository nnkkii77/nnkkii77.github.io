<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nam Jung Kim — Works</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: #111;
      background: #f5f5f3;
    }

    .header {
      position: sticky;
      top: 0;
      background: rgba(245,245,243,.96);
      backdrop-filter: blur(6px);
      z-index: 100;
    }

    .nav {
      max-width: 1380px;
      margin: 0 auto;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      text-decoration: none;
      color: inherit;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 34px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .menu a {
      text-decoration: none;
      color: #8b8b8b;
    }

    .menu a.active,
    .menu a:hover {
      color: #111;
    }

    .container {
      max-width: 1380px;
      margin: 0 auto;
      padding: 64px 28px 70px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 44px 40px;
    }

    .card {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 1.15 / 1;
      object-fit: cover;
      display: block;
      background: #ececec;
    }

    .label {
      margin-top: 22px;
      text-align: center;
      font-size: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .nav {
        flex-direction: column;
        align-items: flex-start;
      }

      .menu {
        gap: 18px;
        flex-wrap: wrap;
      }

      .container {
        padding-top: 34px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .label {
        font-size: 16px;
        margin-top: 14px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a class="brand" href="works.html">Nam Jung Kim</a>
      <div class="menu">
        <a href="about.html">About</a>
        <a class="active" href="works.html">Works</a>
        <a href="publications.html">Publications</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="grid">
      <a class="card" href="#">
        <img class="thumb" src="assets/installation.jpg" alt="Installation" />
        <div class="label">Installation</div>
      </a>

      <a class="card" href="#">
        <img class="thumb" src="assets/video.jpg" alt="Video" />
        <div class="label">Video</div>
      </a>

      <a class="card" href="#">
        <img class="thumb" src="assets/research-projects.jpg" alt="Research Projects" />
        <div class="label">Research Projects</div>
      </a>

      <a class="card" href="#">
        <img class="thumb" src="assets/drawing-painting.jpg" alt="Drawing and Painting" />
        <div class="label">Drawing / Painting</div>
      </a>

      <a class="card" href="#">
        <img class="thumb" src="assets/community-projects.jpg" alt="Community Projects" />
        <div class="label">Community Projects</div>
      </a>
    </section>
  </main>
</body>
</html>
