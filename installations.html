<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nam Jung Kim — Installations</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
background:#f5f5f3;
color:#111;
}

.header{
position:sticky;
top:0;
background:rgba(245,245,243,.96);
backdrop-filter:blur(6px);
z-index:100;
}

.nav{
max-width:1380px;
margin:0 auto;
padding:18px 28px;
display:flex;
align-items:center;
justify-content:space-between;
gap:20px;
}

.brand{
text-decoration:none;
color:inherit;
font-size:24px;
font-weight:700;
letter-spacing:.04em;
text-transform:uppercase;
}

.menu{
display:flex;
gap:34px;
font-size:12px;
letter-spacing:.18em;
text-transform:uppercase;
}

.menu a{
text-decoration:none;
color:#8b8b8b;
}

.menu a:hover,
.menu a.active{
color:#111;
}

.container{
max-width:1380px;
margin:0 auto;
padding:54px 28px 80px;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:48px 40px;
}

.card{
display:block;
text-decoration:none;
color:inherit;
}

.thumb{
width:100%;
aspect-ratio:1/1.15;
object-fit:cover;
display:block;
background:#ececec;
}

.label{
margin-top:12px;
font-size:12px;
letter-spacing:.14em;
text-transform:uppercase;
text-align:center;
line-height:1.8;
color:#666;
}

@media (max-width:1100px){
.grid{grid-template-columns:repeat(3,1fr);}
}

@media (max-width:800px){
.grid{grid-template-columns:repeat(2,1fr);}
}

@media (max-width:640px){
.nav{
flex-direction:column;
align-items:flex-start;
}
.menu{
gap:18px;
flex-wrap:wrap;
}
.grid{
grid-template-columns:1fr;
gap:28px;
}
}
</style>
</head>
