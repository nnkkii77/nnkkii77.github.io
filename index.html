<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nam Jung Kim</title>
  <style>
    :root { --pad: 48px; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #000;
    }

    .bg {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-image: url("https://nnkkii77.github.io/images/entry1.jpg");
      filter: brightness(0.95);
      transform: scale(1.02);
      transition: background-image 0.8s ease-in-out;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.2));
      z-index: 1;
    }

    .wrap {
      position: relative;
      z-index: 2;
      height: 100vh;
      padding: var(--pad);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }

    .name {
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: 0.02em;
      font-weight: 600;
      margin: 0;
    }

    .enter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 10px 2px;
      border-bottom: 1px solid rgba(255,255,255,.65);
    }

    .enter:hover {
      border-bottom-color: rgba(255,255,255,1);
    }

    @media (max-width: 640px) {
      :root { --pad: 24px; }
      .wrap { align-items: flex-end; }
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="overlay"></div>

  <main class="wrap">
    <h1 class="name">Nam Jung Kim</h1>
    <a class="enter" href="works.html" aria-label="Enter site">ENTER</a>
  </main>

  <script>
    const images = [
      "https://nnkkii77.github.io/images/entry1.jpg",
      "https://nnkkii77.github.io/images/entry2.jpg",
      "https://nnkkii77.github.io/images/entry3.jpg"
    ];

    const bg = document.getElementById("bg");
    let current = 0;

    setInterval(() => {
      current = (current + 1) % images.length;
      bg.style.backgroundImage = `url("${images[current]}")`;
    }, 3000);
  </script>
</body>
</html>
